name: Deploy to Hostinger via FTP

# Triggers on every push to main, plus manual run from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Don't deploy two commits in parallel — newer push waits for in-flight to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & FTP upload
    runs-on: ubuntu-latest
    # First deploy uploads ~5,000 files (vendor/ + node_modules build output) over FTP,
    # which can take 30–45 min due to FTP's per-file overhead. Subsequent deploys are
    # fast (~2–4 min) because only changed files are sent.
    timeout-minutes: 60

    steps:
      # ──────────────────────────────────────────────────────────
      # 1. Checkout source
      # ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────
      # 2. PHP setup + composer (production-only deps)
      # ──────────────────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcre, pdo, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies (production)
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader

      # ──────────────────────────────────────────────────────────
      # 3. Node + Vite build
      # ──────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets (Vite)
        run: npm run build

      # ──────────────────────────────────────────────────────────
      # 4. Sanity: strip dev artifacts AND vendor bloat to speed FTP upload
      #    Removes thousands of unused files so first deploy is much faster.
      # ──────────────────────────────────────────────────────────
      - name: Strip dev artifacts and vendor bloat
        run: |
          rm -f public/hot
          rm -rf node_modules tests .git .github

          # Remove tests, docs, examples from vendor — they ship by default but
          # add ~30% to vendor size and contribute most of the small-file count.
          find vendor -type d \( \
            -name 'tests' -o \
            -name 'test' -o \
            -name 'Tests' -o \
            -name 'docs' -o \
            -name 'doc' -o \
            -name 'examples' -o \
            -name 'example' -o \
            -name 'benchmarks' -o \
            -name '.github' \
          \) -prune -exec rm -rf {} + 2>/dev/null || true

          # Remove docs / changelogs / readmes
          find vendor -type f \( \
            -iname '*.md' -o \
            -iname 'changelog*' -o \
            -iname 'license*' -o \
            -iname 'readme*' -o \
            -iname 'upgrade*' -o \
            -iname 'phpunit.xml*' -o \
            -iname '.editorconfig' -o \
            -iname '.gitignore' -o \
            -iname '.gitattributes' \
          \) -delete 2>/dev/null || true

          echo "vendor/ size after cleanup:"
          du -sh vendor 2>/dev/null
          echo "vendor/ file count:"
          find vendor -type f | wc -l

      # ──────────────────────────────────────────────────────────
      # 5. Upload to Hostinger via FTPS
      #    SECURITY: always use FTPS (port 21 with TLS), never plain FTP
      # ──────────────────────────────────────────────────────────
      - name: Sync files to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}        # usually 21 for FTPS
          protocol: ftps                        # explicit TLS upgrade
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/  # e.g. domains/your-domain.com/exam_management/
          local-dir: ./
          dangerous-clean-slate: false          # keep .env, storage/, public/storage on server
          # State file kept on server tracks what's already uploaded — so if this
          # workflow times out and you re-run it, it resumes instead of re-uploading
          # files that already made it across. Critical for first-deploy success.
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal                    # less noise in the GH Actions log
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.example
            **/.env.local
            **/.env.production
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/.github/**
            **/tests/**
            **/phpunit.xml
            **/.editorconfig
            **/.gitignore
            **/.gitattributes
            **/README.md
            **/DEPLOY.md
            **/deploy.sh
            **/.styleci.yml
            **/.phpunit.result.cache
            **/database/database.sqlite

      # ──────────────────────────────────────────────────────────
      # 6. Run post-deploy hook on the server
      #    The hook (a tiny PHP script you upload once) runs migrations,
      #    clears caches, and bumps the public/build manifest. It's
      #    protected by a shared secret so only this workflow can hit it.
      #    Note: GitHub Actions disallows referencing `secrets.*` directly
      #    inside `if:` — we assign to env first, then check env in the if.
      # ──────────────────────────────────────────────────────────
      - name: Trigger post-deploy hook (migrations + cache clear)
        env:
          HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        if: env.HOOK_URL != ''
        run: |
          echo "→ Hitting deploy hook at $HOOK_URL"
          curl --fail --show-error \
               --max-time 120 \
               -X POST \
               -H "X-Deploy-Secret: $HOOK_SECRET" \
               "$HOOK_URL"
