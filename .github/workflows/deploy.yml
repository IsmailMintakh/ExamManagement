name: Deploy to Hostinger via FTP

# Triggers on every push to main, plus manual run from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Don't deploy two commits in parallel — newer push waits for in-flight to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & FTP upload
    runs-on: ubuntu-latest
    # vendor/ is built ON THE SERVER (by deploy-hook.php running composer install),
    # so we only FTP-upload app source + built frontend assets — typically ~500
    # files. Most deploys finish in 1–2 minutes. Composer install on the server
    # adds ~30–60 seconds.
    timeout-minutes: 15

    steps:
      # ──────────────────────────────────────────────────────────
      # 1. Checkout source
      # ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────
      # 2. PHP + composer install
      #    We DO need vendor/ in CI so Vite can resolve PHP-package JS modules
      #    (Ziggy ships its Vue plugin inside vendor/tightenco/ziggy/).
      #    But we DON'T upload vendor/ — it's in the FTP exclude list below,
      #    and the server runs its own `composer install` via deploy-hook.php
      #    so the production vendor matches composer.lock exactly.
      # ──────────────────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies (for CI build only — not uploaded)
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader

      # ──────────────────────────────────────────────────────────
      # 3. Node + Vite build
      #    Frontend MUST be built in CI because Hostinger doesn't always
      #    have Node available, and even when it does, build-on-server
      #    eats memory we'd rather give to Laravel.
      # ──────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets (Vite)
        run: npm run build

      # ──────────────────────────────────────────────────────────
      # 4. Strip dev artifacts before FTP upload
      # ──────────────────────────────────────────────────────────
      - name: Strip dev artifacts
        run: |
          rm -f public/hot
          rm -rf node_modules tests .git .github
          echo "Files to upload: $(find . -type f | wc -l)"

      # ──────────────────────────────────────────────────────────
      # 5. Pre-flight TCP probe — diagnoses connectivity issues fast
      #    Fails the workflow with a clear "host unreachable" message
      #    *before* the SamKirkland action eats 2+ minutes hitting an
      #    ETIMEDOUT. Hostinger occasionally rate-limits or drops the
      #    listener — rerun the workflow in a few minutes if this trips.
      # ──────────────────────────────────────────────────────────
      - name: Pre-flight FTPS connectivity check
        env:
          HOST: ${{ secrets.FTP_HOST }}
          PORT: ${{ secrets.FTP_PORT }}
        run: |
          echo "→ Probing $HOST:$PORT (TCP handshake only)"
          if timeout 15 bash -c "</dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✓ FTPS host reachable"
          else
              echo "✗ Cannot reach FTPS host $HOST:$PORT within 15s"
              echo ""
              echo "─── Common causes ───"
              echo "  1. Hostinger temporarily rate-limited this runner's IP"
              echo "     → Wait 5-10 min and re-run the workflow"
              echo "  2. FTP_HOST or FTP_PORT secret has the wrong value"
              echo "     → Double-check at Hostinger hPanel → Files → FTP"
              echo "  3. Hostinger's FTP service is down (rare)"
              echo "     → Check status.hostinger.com"
              echo ""
              echo "Continuing anyway — the upload step has its own retry chain."
          fi

      # ──────────────────────────────────────────────────────────
      # 6. Upload to Hostinger via FTPS
      #    SECURITY: always use FTPS (port 21 with TLS), never plain FTP
      #
      #    Wrapped in a retry loop because Hostinger's FTP control socket
      #    drops idle connections aggressively, surfacing as "Timeout
      #    (control socket)" mid-upload. Each attempt resumes from the
      #    state file, so retries pick up where the previous run died
      #    instead of starting from zero.
      #
      #    Between attempts we WAIT — back-to-back retries hit the same
      #    blocked TCP socket and all fail. A pause lets transient rate
      #    limits clear before we knock again.
      # ──────────────────────────────────────────────────────────
      - name: Sync files to Hostinger via FTPS (attempt 1)
        id: ftp_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}        # usually 21 for FTPS
          protocol: ftps                        # explicit TLS upgrade
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/  # e.g. domains/your-domain.com/exam_management/
          local-dir: ./
          dangerous-clean-slate: false          # keep .env, storage/, public/storage on server
          # State file kept on server tracks what's already uploaded — so if this
          # workflow times out and you re-run it, it resumes instead of re-uploading
          # files that already made it across. Critical for first-deploy success.
          state-name: .ftp-deploy-sync-state.json
          # Increase per-operation timeout. The default 30s isn't enough when
          # Hostinger's control socket pauses for a beat between transfers.
          timeout: 120000                       # 2 minutes per op
          log-level: minimal                    # less noise in the GH Actions log
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.example
            **/.env.local
            **/.env.production
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/.github/**
            **/tests/**
            **/phpunit.xml
            **/.editorconfig
            **/.gitignore
            **/.gitattributes
            **/README.md
            **/DEPLOY.md
            **/deploy.sh
            **/.styleci.yml
            **/.phpunit.result.cache
            **/database/database.sqlite

      # Wait 60s before attempt 2 — gives Hostinger time to forgive any
      # transient rate-limit on this runner's IP. Without this pause, all
      # 3 retries can hit the same closed window and uniformly fail.
      - name: Wait before retry 2
        if: steps.ftp_attempt_1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed — waiting 60s before retry to let any rate-limit clear"
          sleep 60

      # Resume on first failure. Hostinger's FTP often drops the control
      # socket once or twice during a fresh deploy; the state file means
      # this picks up where attempt 1 stopped, not from scratch.
      - name: Sync files to Hostinger via FTPS (attempt 2 — resume)
        id: ftp_attempt_2
        if: steps.ftp_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/
          local-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.example
            **/.env.local
            **/.env.production
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/.github/**
            **/tests/**
            **/phpunit.xml
            **/.editorconfig
            **/.gitignore
            **/.gitattributes
            **/README.md
            **/DEPLOY.md
            **/deploy.sh
            **/.styleci.yml
            **/.phpunit.result.cache
            **/database/database.sqlite

      # Wait 120s before attempt 3 — longer pause for the final shot.
      # If even this fails, the network or credentials are at fault, not
      # a transient timeout.
      - name: Wait before retry 3
        if: steps.ftp_attempt_2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed — waiting 120s before final retry"
          sleep 120

      # Final attempt. If this also fails the workflow halts — usually
      # signals a credential or DNS issue, not a transient timeout.
      - name: Sync files to Hostinger via FTPS (attempt 3 — final)
        if: steps.ftp_attempt_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/
          local-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          timeout: 180000                       # 3 minutes — be generous on the final shot
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.example
            **/.env.local
            **/.env.production
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/.github/**
            **/tests/**
            **/phpunit.xml
            **/.editorconfig
            **/.gitignore
            **/.gitattributes
            **/README.md
            **/DEPLOY.md
            **/deploy.sh
            **/.styleci.yml
            **/.phpunit.result.cache
            **/database/database.sqlite

      # ──────────────────────────────────────────────────────────
      # 6. Run post-deploy hook on the server
      #    The hook (a tiny PHP script you upload once) runs migrations,
      #    clears caches, and bumps the public/build manifest. It's
      #    protected by a shared secret so only this workflow can hit it.
      #    Note: GitHub Actions disallows referencing `secrets.*` directly
      #    inside `if:` — we assign to env first, then check env in the if.
      # ──────────────────────────────────────────────────────────
      - name: Trigger post-deploy hook (migrations + cache clear)
        env:
          HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        if: env.HOOK_URL != ''
        run: |
          echo "→ Hitting deploy hook at $HOOK_URL"
          curl --fail --show-error \
               --max-time 120 \
               -X POST \
               -H "X-Deploy-Secret: $HOOK_SECRET" \
               "$HOOK_URL"
