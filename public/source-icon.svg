<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient: emerald -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft glow accent in upper-right -->
  <circle cx="420" cy="100" r="120" fill="#10b981" opacity="0.18"/>

  <!-- Academic cap (mortarboard) -->
  <g transform="translate(96, 130)">
    <!-- Cap top (square mortarboard) -->
    <path d="M 160 0 L 320 70 L 160 140 L 0 70 Z"
          fill="url(#cap)"
          stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>

    <!-- Cap underside (the part that sits on the head) -->
    <path d="M 60 100 L 60 180 Q 60 220 160 220 Q 260 220 260 180 L 260 100 L 160 145 Z"
          fill="#fcd34d"
          stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>

    <!-- Tassel cord -->
    <line x1="320" y1="70" x2="340" y2="70" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
    <line x1="340" y1="70" x2="340" y2="140" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>

    <!-- Tassel -->
    <circle cx="340" cy="150" r="8" fill="#7c2d12"/>
    <line x1="335" y1="155" x2="332" y2="180" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
    <line x1="340" y1="155" x2="340" y2="185" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
    <line x1="345" y1="155" x2="348" y2="180" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
